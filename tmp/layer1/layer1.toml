initial_time = 0.25

# Layer 1: season already enabled, default 2400s = 40min per season.
# Per FINAL_BLUEPRINT decision D2 (80min/year = 20min/season for fast
# iteration), set to 1200s. ThermalTickCapability uses ambient_spring
# / summer / autumn / winter directly (18/28/15/5 deg C).
[world.season]

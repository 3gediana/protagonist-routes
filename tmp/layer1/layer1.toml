# Layer 1: explicit day-night cycle (was default but now visible).
# Reference: TimeOfDayLayer + Layer 1 extensions (phaseSin/Cos /
# visibilityFactor / ambientTemperatureDelta). DayNightLayer wiring
# already exists in ProtagonistWorldFactory (line 303-307).
[world.day_night]

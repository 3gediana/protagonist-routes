[evolution]
generations = 60
episode_ticks = 1200
episodes_per_generation = 6
# L2.6 v11: stable curriculum — all 6 episodes within one generation
# share the same sampled task_template.
task_template_stable_within_generation = true
# L2.6 v12 four-mechanism stack (literature-backed):
#  Step 1 (Context-conditioned policy, PEARL/RL²) - 8-onehot template
#         index input to brain, lets one network learn task-specific
#         behaviour without deleting templates.
#  Step 2 (Decoupled intrinsic motivation, Cuccu/Schmidhuber 2011) -
#         intrinsic_weight * novelty_reward NO LONGER scaled by
#         outcome_weight, so sparse-reward exploration survives.
#  Step 3 (ACCEL regret-based weighting, Parker-Holder 2022) - per-
#         template (best - avg) EMA, high-regret templates ("agent
#         ALMOST solves it") auto-upweighted.
#  Step 4 (Hard-Tasks-First, SMT ICML 2024) - in early generations,
#         declared-difficulty boost so the network confronts hard
#         tasks first.
# L2.8 v14: ME-NEAT replaces multi-task curriculum. Quality-diversity
# archive substitutes for ACCEL/SMT - cell elites preserve diverse
# strategies (chops only / chops+build / build+craft / hunt+build / ...)
# instead of a curriculum-driven specialist mono-culture. So the
# v12-era dynamic weighting + hard-first warmup is disabled; templates
# are kept (one stable per generation) only as environment variation,
# not as a learning signal.
task_context_perception_enabled = true
task_template_dynamic_weight = false
task_template_hard_first_generations = 0
checkpoint_every = 30

# L2.8 v14 ME-NEAT (MAP-Elites + NEAT). Behaviour descriptor (P1
# conservative): x=chop_count (bin=20), y=build+craft (bin=2), 5x5=25
# cells. me_neat_non_elite_weight=0.05 strongly suppresses non-elite
# fitness during reproduce so EliteSelection + TournamentSelection
# converge on cell elites. See QualityDiversityArchive.h for design
# rationale and the literature citations (Mouret&Clune MAP-Elites,
# InstaDeep ICLR23 spotlight, Cully 2018).
[evolution.me_neat]
enabled = true
chops_bin_size = 20
workcraft_bin_size = 2
max_bins = 5
non_elite_weight = 0.05

[evolution.neat]
add_node_rate = 0.04
add_connection_rate = 0.10
toggle_connection_rate = 0.02
add_modulatory_rate = 0.005
compatibility_threshold = 3.0

[evolution.selection]
elite_ratio = 0.20
tournament_size = 3

[evolution.mutation]
weight_perturb_rate = 0.80
weight_reset_rate = 0.05
weight_perturb_sigma = 0.50

[trace]
enabled = true
events_enabled = true
agents_enabled = true
world_enabled = true
agent_interval = 10
world_interval = 10
max_generations = 1
max_episodes_per_generation = 1

# L2.2 v2 smoke: drive-delta reward as primary signal.
# outcome_weight=0.05 fades the legacy v9 reward components down to
# 5% of their old magnitude; drive_weight=15 gives the homeostatic
# penalty enough authority to actually move fitness.
[reward]
drive_weight = 5.0
outcome_weight = 0.20
drive_thirst_from_hydration = true
survival_weight = 1.0
food_weight = 10.0
intrinsic_weight = 4.0
combat_weight = 1.0
cooperation_weight = 6.0
communication_weight = 4.0
worksite_proximity_reward = 0.05
worksite_completion_reward = 60.0
social_proximity_reward = 0.01
social_proximity_radius = 6.0
signal_emit_reward = 0.04
signal_emit_companion_radius = 12.0
signal_co_attendance_reward = 0.6
signal_co_attendance_radius = 8.0
signal_co_attendance_window = 40
joint_hunt_reward = 8.0
joint_hunt_radius = 10.0

# L2.7 v13 HRL sub-rewards (Hierarchical RL dense signals).
# Each goal completion event gives the protagonist a dense reward
# independent of outcome_weight, breaking the long
# chop -> carry -> deposit -> build chain into 4 short sub-tasks.
[reward.goal_completion]
chop_tree      = 4.0
gather_stick   = 1.0
gather_stone   = 1.0
build_worksite = 20.0
craft_weapon   = 8.0
hunt           = 10.0
find_water     = 3.0
find_food      = 2.0

[combat]
attack_reward = 1.5
kill_bonus = 8.0
death_penalty = 4.0

# L2.3 v2 smoke: enable plant kind partitioning + drive-delta reward.
[world.resources.plant_weights]
grass = 0.5
browse = 0.3
fruit = 0.2



dehydration_threshold_ratio = 0.32
dehydration_damage_per_tick = 0.14
fire_health_damage_per_tick = 0.40
warmth_recovery_per_tick = 0.06
nest_recovery_per_tick = 0.10
injured_threshold_ratio = 0.45

[world.tree]

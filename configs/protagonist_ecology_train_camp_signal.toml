# protagonist_ecology_train_camp_signal.toml
#
# Camp building + signal response co-training. Based on
# protagonist_ecology_train_camp_building_evolve.toml, plus a controlled
# signal emitter that pulses every 30s from a randomised position around
# the base. Each pulse drops a small amount of transient food at the
# emitter, so an agent that learns to follow the signal during the silent
# gap gets a real reward signal via the food chain.
#
# Goal: produce a genome that scores well in BOTH camp_building (current
# train task) AND signal_response (memory ablation eval task), so the
# fixed-task ablation can finally exhibit a clean spatial / episodic
# memory separation on signal_response_events, not just on fitness.

[runtime]
random_seed = 91
log_level = "info"
preview_ticks = 1
world_role = "train"
scenario_name = "curriculum_camp_signal"

[output]
runs_dir = "data/runs/protagonist_train_camp_signal_audit_v7"

[world]
size = [200.0, 200.0]

[world.resources]
count = 84
amount = 18.0
respawn_ticks = 14
dynamic = true
regen_rate = 0.20
terrain_adjustment_enabled = true

[world.terrain]
enabled = true
height_scale = 30.0
slope_resistance = 0.38
cave_density = 0.04
cave_shelter_factor = 0.50
min_velocity_factor = 0.18
seed = 91
grid_resolution = 128
perlin_frequency = 3.8
perlin_persistence = 0.48
perlin_octaves = 4

[world.signal]
enabled = true
channels = 2
grid_resolution = 64
decay_rate = 0.05
diffusion_rate = 0.08
# Controlled emitter: 30s pulse + silent gap, randomised episode-level
# position around base. controlled_emitter_food_* drops transient food
# at each pulse so "follow the signal" pays off via the food chain.
controlled_emitter_enabled = true
controlled_emitter_period_seconds = 30.0
controlled_emitter_offset_radius = 28.0
controlled_emitter_offset_jitter = 10.0
controlled_emitter_randomize_position = true
controlled_emitter_food_radius = 6.0
controlled_emitter_food_count = 2
controlled_emitter_food_amount = 12.0

[world.objects]

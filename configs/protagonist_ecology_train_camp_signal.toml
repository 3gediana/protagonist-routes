center_x = 60.0
center_y = 100.0
radius = 18.0
stockpile_radius = 12.0
nest_radius = 10.0
stockpile_offset = 14.0
nest_offset = -12.0

[world.nursery]
enabled = true
deposit_energy_bonus = 8.0
deposit_fitness_bonus = 3.0
stockpile_snap_radius = 6.0

[world.nursery_supply]
enabled = true
min_nearby_sticks = 8
replenish_batch = 4
near_radius = 16.0
spawn_radius = 10.0
cooldown_ticks = 22

[world.campfire]

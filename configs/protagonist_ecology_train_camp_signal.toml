episode_ticks = 1400
episodes_per_generation = 3
checkpoint_every = 10

[evolution.neat]
add_node_rate = 0.04
add_connection_rate = 0.10
toggle_connection_rate = 0.02
add_modulatory_rate = 0.005
compatibility_threshold = 3.0

[evolution.selection]
elite_ratio = 0.15
tournament_size = 4

[evolution.mutation]
weight_perturb_rate = 0.80
weight_reset_rate = 0.05
weight_perturb_sigma = 0.40

[reward]
survival_weight = 1.0
food_weight = 10.0
intrinsic_weight = 4.0
combat_weight = 1.0
cooperation_weight = 6.0
# Bumped from 4.0 -> 6.0 so the signal_co_attendance + signal_emit
# rewards fire harder while the controlled emitter trains the listener
# half of the policy.
communication_weight = 6.0
worksite_proximity_reward = 0.06
worksite_completion_reward = 80.0
social_proximity_reward = 0.012
social_proximity_radius = 6.5
# Bumped from 0.04 -> 0.10. Emitting in front of teammates is now mildly
# more profitable, but we still rely mostly on food drops at the
# controlled emitter to teach the response side.
signal_emit_reward = 0.10
signal_emit_companion_radius = 12.0
# Bumped from 0.7 -> 1.5 so co-attendance with the controlled emitter
# (or peers) is genuinely competitive with food / camp rewards.
signal_co_attendance_reward = 1.5
signal_co_attendance_radius = 8.0
# Window in seconds within which a co-attendance counts after a pulse.
# 15s matches the memory ablation eval window so what the policy learns
# in train transfers cleanly to eval.
signal_co_attendance_window_seconds = 15.0
joint_hunt_reward = 10.0
joint_hunt_radius = 10.0

[combat]
attack_reward = 1.5
kill_bonus = 8.0
death_penalty = 4.0

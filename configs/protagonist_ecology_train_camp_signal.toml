[evolution]
# v7: 60 generations. v6 ran 30 generations with halo 12m + companion
# 30m + dense gradient and produced bit-exact identical fitness across
# the five ablation variants on signal_response (6.63 each), strongly
# suggesting the policy was not yet using the listener-side gradient
# even though emit-side fitness reached 140k. The hypothesis for v7
# is "underTrained, not structurally blocked" - same task, double the
# generations.
generations = 60
episode_ticks = 1400
episodes_per_generation = 3
checkpoint_every = 10

[evolution.neat]
add_node_rate = 0.04
add_connection_rate = 0.10
toggle_connection_rate = 0.02
add_modulatory_rate = 0.005
compatibility_threshold = 3.0

[evolution.selection]
elite_ratio = 0.15
tournament_size = 4

[evolution.mutation]
weight_perturb_rate = 0.80
weight_reset_rate = 0.05
weight_perturb_sigma = 0.40

[reward]
survival_weight = 1.0
food_weight = 10.0
intrinsic_weight = 4.0
combat_weight = 1.0
cooperation_weight = 6.0
# Bumped from 4.0 -> 6.0 so the signal_co_attendance + signal_emit
# rewards fire harder while the controlled emitter trains the listener
# half of the policy.
communication_weight = 6.0
worksite_proximity_reward = 0.06
worksite_completion_reward = 80.0
social_proximity_reward = 0.012
social_proximity_radius = 6.5
# Bumped from 0.04 -> 0.10. Emitting in front of teammates is now mildly
# more profitable, but we still rely mostly on food drops at the
# controlled emitter to teach the response side.
signal_emit_reward = 0.10
# v5 fix: bumped 12 -> 30 so listener-side episodic write
# (peer_signal_heard) and the dense distance-gradient reward both
# trigger on the controlled emitter, which sits ~28m away from the
# nest. With 12m the emitter pulse was outside the listener's
# response window during training and the controller never got any
# gradient toward signal sources -- the v4 retrain produced a
# "signals=0" listener even though emit-side rewards fired normally.
# 30m matches the SignalResponse ablation eval task so train and eval
# agree on what counts as "I heard a peer".
signal_emit_companion_radius = 30.0
# Bumped from 0.7 -> 1.5 so co-attendance with the controlled emitter
# (or peers) is genuinely competitive with food / camp rewards.
signal_co_attendance_reward = 1.5
# v6: softened halo 8 -> 12 to match the eased SignalResponse ablation
# task. v5 confirmed listeners can collect the 30m dense gradient but
# could not consistently land inside an 8m halo in 30 generations.
signal_co_attendance_radius = 12.0
# Window in seconds within which a co-attendance counts after a pulse.
# 15s matches the memory ablation eval window so what the policy learns
# in train transfers cleanly to eval.
signal_co_attendance_window_seconds = 15.0
# Listener-side reward: counts every time an agent enters the response
# halo of a recent pulse (incl. the controlled emitter). The condition
# is identical to the ablation eval signal_response_events metric, so
# learning to chase this reward directly improves the eval score. Off
# by default in other configs; on here so camp+signal co-training has
# a real listener-side gradient.
signal_response_reward = 1.5
# Audit § 4.4 chicken-and-egg break. Each tick the listener accrues
# `signal_response_dense_reward * (1 - dist/companion_radius) * dt`
# for every peer emit within companion_radius + response window.
# Without this dense gradient the listener had no reason to walk
# toward an emitter; the binary halo entry was effectively
# unreachable (~0 events in three prior 30-generation runs). With
# the gradient + the new peer_signal_heard episodic readback on
# perception dim 18-21, the controller can now learn the chain
# "heard signal -> turn toward source -> enter halo".
signal_response_dense_reward = 1.0
joint_hunt_reward = 10.0
joint_hunt_radius = 10.0

[combat]
attack_reward = 1.5
kill_bonus = 8.0
death_penalty = 4.0

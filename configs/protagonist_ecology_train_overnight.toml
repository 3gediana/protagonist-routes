# Overnight full-ecosystem training: 250 agents on 600x600 map.
# 8 species (1 protagonist + 7 background) with independent NEAT co-evolution.
# Real corpse system: dead agents leave meat resources for scavengers/predators.
# Aerial scavenger (vulture) bypasses terrain slope.

[runtime]
random_seed = 4242
log_level = "info"
preview_ticks = 1
world_role = "train"
scenario_name = "ecosystem_overnight"

[output]
runs_dir = "data/runs/protagonist_overnight"

# ============================================================================
# World: 600 x 600 — large enough for distinct biomes, hunt zones, refuges.
# Resource and feature counts scaled ~9x relative to 200x200 baseline.
# ============================================================================
[world]
size = [600.0, 600.0]

[world.resources]
count = 720
amount = 18.0
respawn_ticks = 14
dynamic = true
regen_rate = 0.20
terrain_adjustment_enabled = true

[world.terrain]
enabled = true
height_scale = 30.0
slope_resistance = 0.38
cave_density = 0.06
cave_shelter_factor = 0.50
min_velocity_factor = 0.18
seed = 4242
grid_resolution = 256
perlin_frequency = 3.8
perlin_persistence = 0.48
perlin_octaves = 4

[world.signal]
enabled = true
channels = 2
grid_resolution = 96
decay_rate = 0.05
diffusion_rate = 0.08

[world.objects]
enabled = true
count = 360
damping = 0.9

[world.base]
enabled = true
center_x = 200.0
center_y = 300.0
radius = 22.0
stockpile_radius = 14.0
nest_radius = 12.0
stockpile_offset = 16.0
nest_offset = -14.0

[world.nursery]
enabled = true
deposit_energy_bonus = 8.0
deposit_fitness_bonus = 3.0
stockpile_snap_radius = 6.0

[world.nursery_supply]
enabled = true
min_nearby_sticks = 12
replenish_batch = 6

# ============================================================================
# Population: 250 agents total
# Protagonist 30 (12%) — humans
# Plant-eaters 92 (36.8%) — Large herbivore + Small forager
# Carnivores  42 (16.8%) — Apex + Pack + Ambush
# Scavengers  26 (10.4%) — Vultures (aerial)
# Omnivores   60 (24.0%) — Boars
# ============================================================================
[population.protagonist]
count = 30
hidden_dim = 512
memory_cells = 48
action_dim = 13

[population.background]
hidden_dim = 32

[[population.background.species]]
archetype = "large_herbivore"
count = 50

[[population.background.species]]
archetype = "small_forager"
count = 42

[[population.background.species]]
archetype = "apex_predator"
count = 8

[[population.background.species]]
archetype = "pack_hunter"
count = 20

[[population.background.species]]
archetype = "ambush_predator"
count = 14

[[population.background.species]]
archetype = "scavenger"
count = 26

[[population.background.species]]
archetype = "omnivore"
count = 60

# ============================================================================
# Evolution: long, deep training
# 300 generations × 1800 ticks × 3 episodes ≈ overnight on 8-core CPU.
# ============================================================================
[evolution]
generations = 300
episode_ticks = 1800
episodes_per_generation = 3
checkpoint_every = 25

[evolution.neat]
add_node_rate = 0.04
add_connection_rate = 0.10
toggle_connection_rate = 0.02
add_modulatory_rate = 0.005
compatibility_threshold = 3.0

[evolution.selection]
elite_ratio = 0.12
tournament_size = 5

[evolution.mutation]
weight_perturb_rate = 0.85
weight_reset_rate = 0.05
weight_perturb_sigma = 0.40

# ============================================================================
# Reward: heavily incentivize cooperation, communication, and long-horizon goals.
# ============================================================================
[reward]
survival_weight = 1.0
food_weight = 10.0
intrinsic_weight = 4.0
combat_weight = 1.0
cooperation_weight = 8.0
communication_weight = 5.0
worksite_proximity_reward = 0.06
worksite_completion_reward = 100.0
social_proximity_reward = 0.014
social_proximity_radius = 7.0
signal_emit_reward = 0.05
signal_emit_companion_radius = 14.0
signal_co_attendance_reward = 0.8
signal_co_attendance_radius = 9.0
signal_co_attendance_window = 60
joint_hunt_reward = 12.0
joint_hunt_radius = 12.0

# Background species reward weights
[reward.prey]
survival_weight = 0.6
food_weight = 4.0
social_weight = 0.012
retaliation_weight = 2.5
death_penalty = 1.5
social_radius = 6.0

[reward.predator]
survival_weight = 0.4
kill_weight = 8.0
attack_weight = 1.0
social_weight = 0.010
death_penalty = 1.5
social_radius = 8.0

[combat]
attack_reward = 1.5

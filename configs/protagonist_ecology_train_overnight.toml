spawn_radius_min = 60.0
spawn_radius_max = 220.0
source_radius = 6.0
drink_radius = 4.0
drink_rate = 26.0

[world.survival]
enabled = true
max_health = 100.0
max_hydration = 100.0
initial_health_ratio = 1.0
initial_hydration_ratio = 0.72
hydration_decay_per_tick = 0.055
dehydration_threshold_ratio = 0.30
dehydration_damage_per_tick = 0.16
fire_health_damage_per_tick = 0.45
warmth_recovery_per_tick = 0.06
nest_recovery_per_tick = 0.10
injured_threshold_ratio = 0.45

[world.tree]
enabled = true
count = 80
spawn_radius_min = 40.0
spawn_radius_max = 280.0

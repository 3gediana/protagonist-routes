[reward]
survival_weight = 1.0
food_weight = 10.0
intrinsic_weight = 4.0
combat_weight = 1.0
cooperation_weight = 6.0
communication_weight = 6.0
worksite_proximity_reward = 0.06
worksite_completion_reward = 80.0
# Emergent shelter L1 (B-stage start, 2026-05-22): turn on the
# "use the shelter" signal. Pays per-tick when the protagonist is
# inside a completed worksite AND a predator is within
# shelter_camp_predator_radius. Magnitude is matched to
# worksite_proximity_reward (0.06) so building and using the
# shelter pay at the same per-tick rate when the predator gate
# fires; this prevents reward-hack camping while still teaching
# the late-game half of "fang wei du jian".
shelter_camp_reward = 0.06
shelter_camp_predator_radius = 12.0
social_proximity_reward = 0.012
social_proximity_radius = 6.5
signal_emit_reward = 0.10
# 30 -> 36 so the listener-side dense gradient covers comm_scout_worker eval's
# 22m offset + 6m jitter even on the far side of the jitter range.
signal_emit_companion_radius = 36.0
# 1.5 -> 2.0 so showing up at the emitter halo is more attractive than just
# wandering near food.
signal_co_attendance_reward = 2.0
# 12m halo, unchanged from v6/v7. Matches all comm_* eval tasks' response halo.
signal_co_attendance_radius = 12.0
signal_co_attendance_window_seconds = 15.0
signal_response_reward = 1.5
# 1.0 -> 1.5: stronger dense gradient toward whichever emitter is active.
# The listener-side learning bottleneck identified in audit § 8 is that
# dense gradient was the only signal during the silent-window. Bumping it
# 1.5x gives NEAT a louder gradient to follow.
signal_response_dense_reward = 1.5
joint_hunt_reward = 10.0
joint_hunt_radius = 10.0

[combat]
attack_reward = 1.5
kill_bonus = 8.0
death_penalty = 4.0

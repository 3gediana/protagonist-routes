# protagonist_ecology_train_a3.toml
#
# A3-aware retrain of v7 (`protagonist_ecology_train_camp_signal.toml`),
# 120 generations. Differences from v7:
#   - random_seed 91 -> 137 (independent rollout)
#   - generations 60 -> 120 (more NEAT exploration time for signal semantics)
#   - controlled emitter period 30s -> 15s (twice as many pulses per episode)
#   - controlled emitter food_count 2 -> 3, food_amount 12 -> 18 (stronger
#     reinforcement when listener actually walks to the pulse)
#   - controlled emitter offset_jitter 10 -> 16 (wider position
#     distribution, forces generalisation across emitter locations -
#     matches the comm_scout_worker eval task that randomises emitter
#     position every episode)
#   - signal_response_dense_reward 1.0 -> 1.5 (stronger listener-side
#     gradient toward whichever emitter is active)
#   - signal_co_attendance_reward 1.5 -> 2.0
#   - signal_emit_companion_radius 30 -> 36 (matches comm_scout_worker
#     eval halo at 22m offset + jitter 6m + reach margin)
# Output: data/runs/protagonist_train_a3/
#
# First applied 2026-05-22 for A3 communication-semantics ablation eval;
# produced "v8" genome at peak best_fitness=229k (gen 39) vs v7 ~140k.
# Evidence + ablation drop tables: routes/protagonist_ecology/docx/supporting/
# COMMUNICATION_SEMANTICS_EVIDENCE.md.

[runtime]
random_seed = 137
log_level = "info"
preview_ticks = 1
world_role = "train"
scenario_name = "a3_train_v8"

[output]
runs_dir = "data/runs/protagonist_train_a3"

[world]
size = [200.0, 200.0]

[world.resources]
count = 84
amount = 18.0
respawn_ticks = 14
dynamic = true
regen_rate = 0.20
terrain_adjustment_enabled = true

[world.terrain]
enabled = true
height_scale = 30.0
slope_resistance = 0.38
cave_density = 0.04
cave_shelter_factor = 0.50
min_velocity_factor = 0.18
seed = 137
grid_resolution = 128
perlin_frequency = 3.8
perlin_persistence = 0.48
perlin_octaves = 4

[world.signal]
enabled = true
channels = 2
grid_resolution = 64
decay_rate = 0.05
diffusion_rate = 0.08
controlled_emitter_enabled = true
# Pulse twice as often as v7 (15s vs 30s) so each 1400-tick episode contains
# ~9 pulses instead of ~4. Doubles the per-episode listener-side gradient.
controlled_emitter_period_seconds = 15.0
controlled_emitter_offset_radius = 28.0
# Wider jitter so emitter ends up in many different places across
# episodes - forces generalisation, matches the comm_scout_worker eval
# task's randomised emitter position.
controlled_emitter_offset_jitter = 16.0
controlled_emitter_randomize_position = true
# Stronger food reward at each pulse to reinforce "walk to signal -> eat".
controlled_emitter_food_radius = 6.0
controlled_emitter_food_count = 3
controlled_emitter_food_amount = 18.0

